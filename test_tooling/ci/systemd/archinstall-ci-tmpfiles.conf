# systemd-tmpfiles cleanup rules for archinstall CI
# Install to /etc/tmpfiles.d/archinstall-ci.conf
# Applied automatically by systemd-tmpfiles-clean.timer (daily)
# Manual run: systemd-tmpfiles --clean /etc/tmpfiles.d/archinstall-ci.conf

# Type Path                         Mode User Group Age
# Remove work dirs older than 2 days
e /opt/archinstall-ci/work/*         -    -    -     2d
# Remove ISOs older than 10 days
e /opt/archinstall-ci/iso/*          -    -    -     10d
# Remove log dirs older than 30 days
e /opt/archinstall-ci/logs/*         -    -    -     30d
