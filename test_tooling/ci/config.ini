[github]
repo = archlinux/archinstall
token_file = /opt/archinstall-ci/etc/github-token
base_branch = master

[paths]
work_dir = /opt/archinstall-ci/work
log_dir = /opt/archinstall-ci/logs
iso_dir = /opt/archinstall-ci/iso
state_file = /opt/archinstall-ci/state/tested-commits.json
mirror_repo = /opt/archinstall-ci/mirror/archinstall.git

[filter]
trigger_paths = archinstall/

[qemu]
ovmf_code = /usr/share/ovmf/x64/OVMF_CODE.4m.fd
ovmf_vars = /usr/share/ovmf/x64/OVMF_VARS.4m.fd
test_suite_dir = /opt/archinstall-ci/share/tests-qemu
disk_size = 10G
test_timeout = 1800

[limits]
max_concurrent = 1
